[project]
name = "natlas-inference"
version = "0.1.0"
description = "Minimal authenticated HTTP inference service for NCAIR1/N-ATLaS"
requires-python = ">=3.10"
# Deliberately NOT a dependency of the Prism backend. Keep the heavy ML stack here.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Installed only on the GPU host (Colab / dedicated GPU box).
gpu = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.34",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["natlas_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = []
